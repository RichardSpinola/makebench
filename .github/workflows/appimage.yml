name: AppImage

# Builds the editor AppImage for a version tag (or by hand) and keeps it as a workflow
# artifact with its SHA256SUMS. Publishing a release stays a person's decision.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libnss3 libdbus-1-3 libasound2t64
      - name: Install the project
        run: python -m pip install -e .
      - name: Build the editor AppImage
        run: |
          mkdir -p dist
          python - <<'EOF'
          from pathlib import Path
          from makebench import __version__
          from makebench.core.build_environment import prepare_tools
          from makebench.core.portable import build_editor_appimage, editor_project, prepare

          prepare_tools(print)
          prepare(editor_project(), print, editor=True)
          build_editor_appimage(Path(f"dist/Makebench-{__version__}-x86_64.AppImage"))
          EOF
          cd dist && sha256sum *.AppImage > SHA256SUMS && cat SHA256SUMS
      - name: Check that it starts
        run: |
          chmod +x dist/*.AppImage
          dist/*.AppImage --appimage-extract-and-run --version
      - uses: actions/upload-artifact@v7
        with:
          name: makebench-appimage
          path: dist/
          if-no-files-found: error
