name: Verificações

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verificar formatação
        run: python -m pip install ruff==0.17.2 && ruff format --check src tests checks examples

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar bibliotecas gráficas
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libnss3 libdbus-1-3 libasound2t64
      - name: Instalar o projeto
        run: python -m pip install -e .
      - name: Verificar versão
        run: makebench --version
      - name: Testar documento, lógica, fontes, interface e runtime
        run: python -m unittest discover -s tests -v
      - name: Testar Blockly e WebEngine reais
        run: python checks/blockly_smoke.py
