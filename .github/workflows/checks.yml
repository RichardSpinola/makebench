name: Verificações

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar bibliotecas gráficas
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Instalar o projeto
        run: python -m pip install -e .
      - name: Verificar versão
        run: makebench --version
      - name: Testar documento, persistência e interface
        run: python -m unittest discover -s tests -v
