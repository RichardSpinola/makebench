name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check formatting
        run: python -m pip install ruff==0.17.2 && ruff format --check src tests checks examples

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libnss3 libdbus-1-3 libasound2t64
      - name: Install the project
        run: python -m pip install -e .
      - name: Check version
        run: makebench --version
      - name: Test document, logic, sources, interface and runtime
        run: python -m unittest discover -s tests -v
      - name: Check translation catalogs
        run: python checks/i18n.py
      - name: Test real Blockly and WebEngine
        run: python checks/blockly_smoke.py
      - name: Check size and speed limits
        run: python checks/footprint.py

  docs:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install graphics libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libnss3 libdbus-1-3 libasound2t64
      - name: Install the project and the site tools
        run: python -m pip install -e . -r docs/requirements.txt
      - name: Check the documentation
        run: python checks/docs.py
