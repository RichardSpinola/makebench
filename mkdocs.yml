site_name: Makebench
site_description: Build small Linux apps with blocks or Python.
site_url: https://richardspinola.github.io/makebench/
repo_url: https://github.com/RichardSpinola/makebench
repo_name: RichardSpinola/makebench
edit_uri: edit/main/docs/
copyright: Editor GPL-3.0-or-later · runtime MIT
docs_dir: docs
site_dir: site-build
theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow the system
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow
extra_css:
  - assets/extra.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RichardSpinola/makebench
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          site_description: Crie pequenos apps Linux com blocos ou Python.
          nav_translations:
            Home: Início
            Get started: Começar
            Install: Instalar
            "Tutorial: blocks": "Tutorial: blocos"
            "Tutorial: Python": "Tutorial: Python"
            Examples: Exemplos
            Guides: Guias
            User guide: Guia do usuário
            Data and charts: Dados e gráficos
            Appearance and themes: Aparência e temas
            Exporting: Exportar
            Keyboard shortcuts: Atalhos de teclado
            Questions and problems: Perguntas e problemas
            Reference: Referência
            Components: Componentes
            Blocks: Blocos
            Python API (ctx): API Python (ctx)
            Plugins: Plugins
            Writing plugins: Escrever plugins
            Project: Projeto
            Compatibility: Compatibilidade
            Building and testing: Compilar e testar
            Architecture: Arquitetura
            Contributing: Contribuir
            Changelog: Mudanças
nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - "Tutorial: blocks": tutorial-blocks.md
      - "Tutorial: Python": tutorial-python.md
      - Examples: examples.md
  - Guides:
      - User guide: user-guide.md
      - Data and charts: data.md
      - Appearance and themes: appearance.md
      - Exporting: export.md
      - Keyboard shortcuts: shortcuts.md
      - Questions and problems: faq.md
  - Reference:
      - Components: reference/components.md
      - Blocks: reference/blocks.md
      - Python API (ctx): reference/ctx.md
  - Plugins:
      - Writing plugins: plugins.md
  - Project:
      - Compatibility: compatibility.md
      - Building and testing: building.md
      - Architecture: architecture.md
      - Contributing: contributing.md
      - Changelog: changelog.md
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
