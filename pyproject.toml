[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "makebench"
version = "0.6.0.dev1"
description = "Editor visual de aplicativos Linux com Qt e Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["PySide6==6.11.2"]

[project.scripts]
makebench = "makebench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
makebench = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/blockly/*", "web/vendor/blockly/media/*", "templates/*/*.json", "templates/*/*.py"]
