[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "makebench"
version = "1.0.0-rc.1"
description = "Visual editor for Linux applications with Qt, GTK and Python"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-or-later AND MIT"
license-files = ["LICENSE", "LICENSE-MIT"]
authors = [{ name = "Richard Spinola" }]
keywords = ["visual editor", "gui builder", "qt", "gtk", "pyside6", "blockly", "linux", "ide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["PySide6==6.11.2", "pyte==0.8.2", "jedi==0.20.1", "parso==0.8.7"]

[project.urls]
Homepage = "https://github.com/RichardSpinola/makebench"
Source = "https://github.com/RichardSpinola/makebench"
Issues = "https://github.com/RichardSpinola/makebench/issues"

[project.scripts]
makebench = "makebench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
makebench = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/blockly/*", "web/vendor/blockly/media/*", "notices/*", "templates/*/*.json", "templates/*/*.py", "locale/*/*.po", "editor/*.svg", "editor/stubs/*.pyi", "themepack/*.mbtheme", "pluginpack/*/plugin.json", "pluginpack/*/plugin.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/makebench/web/vendor"]
