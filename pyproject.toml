[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "makebench"
version = "0.7.0.dev1"
description = "Editor visual de aplicativos Linux com Qt e Python"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6==6.11.2", "pyte==0.8.2"]

[project.scripts]
makebench = "makebench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
makebench = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/blockly/*", "web/vendor/blockly/media/*", "notices/*", "templates/*/*.json", "templates/*/*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/makebench/web/vendor"]
